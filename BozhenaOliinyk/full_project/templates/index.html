<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BirdWatcher — Rio Vibes</title>
    <link rel="stylesheet" href="{{ url_with_prefix if url_with_prefix else url_for('static', filename='css/main.css') if false else '/static/css/main.css' }}">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/catalog.css">
    <link rel="stylesheet" href="/static/css/auth_popup.css">
    <link rel="stylesheet" href="/static/css/favorites.css">
</head>
<body>
    <div class="tropical-bg-leaves">
        <div class="leaf-vector monstera-leaf-top"></div>
        <div class="leaf-vector palm-leaf-mid-right"></div>
        <div class="leaf-vector monstera-leaf-mid-left"></div>
        <div class="leaf-vector palm-leaf-bottom"></div>
    </div>


    <header class="main-header">
        <div class="header-left">
            <span class="logo-accent">🦜</span>
        </div>
        <div class="header-center">
            <h1 class="brand-title">BirdWatcher</h1>
        </div>
        <div class="header-right">
            <button class="nav-fav-btn" id="headerFavBtn" aria-label="Favorites">
                <svg class="heart-icon" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </button>
            <div id="authContainer">
                <button class="sign-in-text" id="signInBtn">Sign In</button>
            </div>
        </div>
    </header>


    <main class="catalog-container">
        <div class="catalog-grid">
            {% for bird in birds %}
            <div class="bird-card" data-id="{{ bird.id }}" data-name="{{ bird.name }}" data-image="{{ bird.image }}">
                <div class="card-image-wrapper">
                    <img src="{{ bird.image }}" alt="{{ bird.name }}" class="bird-image">
                </div>
                <div class="card-content">
                    <div class="card-info-left">
                        <h3 class="bird-species">{{ bird.name }}</h3>
                        <p class="bird-location">📍 {{ bird.location }}</p>
                    </div>

                    <div class="card-likes-wrapper">
                        <button class="bottom-heart-btn" aria-label="Like bird">
                            <svg class="bottom-heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                        </button>
                        <span class="likes-count">5,110</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>


    <div class="auth-toast" id="authToast">You need to sign in first</div>


    <div class="blur-overlay" id="blurOverlay"></div>


    <div class="auth-popup" id="authPopup">
        <button class="popup-close" id="closeAuthBtn">&times;</button>
        <h2 class="popup-title" id="popupTitle">Sign In</h2>
        <form class="auth-form" id="authForm" onsubmit="return false;">
            <div class="input-group" id="signupUsernameGroup" style="display: none;">
                <input type="text" id="authUsernameInput" placeholder=" ">
                <label for="authUsernameInput">Username</label>
            </div>
            <div class="input-group">
                <input type="email" id="authEmailInput" required placeholder=" ">
                <label for="authEmailInput">Email Address</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required placeholder=" ">
                <label for="password">Password</label>
            </div>
            <button type="submit" class="submit-btn" id="authSubmitBtn">Sign In</button>
        </form>
        <div class="popup-toggle-mode">
            <span id="togglePrefixText">Don't have an account? </span>
            <button class="toggle-link-btn" id="toggleAuthMode">Sign Up</button>
        </div>
    </div>


    <aside class="favorites-sidebar" id="favoritesSidebar">
        <div class="sidebar-header">
            <h3>My Favorites</h3>
            <button class="sidebar-close" id="closeFavBtn">&times;</button>
        </div>
        <div class="sidebar-content" id="favSidebarContent">
        </div>
    </aside>

    <script src="/static/js/main.js"></script>
</body>
</html>
