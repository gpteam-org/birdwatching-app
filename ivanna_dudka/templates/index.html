<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f6fff9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 100%;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 1.5rem;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 0.5rem;
    }
    .desc {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 1.2rem;
      line-height: 1.6;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f6fff9;
    }
    .row span:first-child { color: #6b7280; }
    .row span:last-child  { font-weight: 600; color: #111; }
    .server-row {
      background: #e6f9f0;
    }
    .server-row span:last-child { color: #0d7a50; }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #1db97b;
      margin-right: 6px;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%  { box-shadow: 0 0 0 0 rgba(29,185,123,.5); }
      70% { box-shadow: 0 0 0 7px rgba(29,185,123,0); }
      100%{ box-shadow: 0 0 0 0 rgba(29,185,123,0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="{{ image }}" alt="photo" />
    <div class="card-body">
      <h1>{{ name }}</h1>
      <p class="desc">{{ description }}</p>
      <div class="meta">
        <div class="row">
          <span>Location</span>
          <span>{{ location }}</span>
        </div>
        <div class="row server-row">
          <span>Server</span>
          <span><span class="dot"></span>{{ hostname }}</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
